name: Deploy Mind Map

on:
  # 手动触发（推荐：在 GitHub Actions 页面点击 Run workflow）
  workflow_dispatch:

  # 后续接入语雀/Notion 后可以取消注释，改为定时或 webhook 触发
  # schedule:
  #   - cron: '*/30 * * * *'   # 每30分钟

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Generate HTML
        run: |
          if (Test-Path generate.py) { python generate.py }
        shell: pwsh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
